<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Color de fondo principal -->
    <style>
      .bg { fill: #FFF5E1; }
      .stroke-detail {
        stroke: #D7A872;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        opacity: 0.45;
      }
      .soft-fill {
        fill: #EED8B9;
        opacity: 0.3;
      }
    </style>

    <!-- Patrón repetible de detalles de repostería -->
    <pattern id="bakery-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      
      <!-- Cupcake / Pastellito -->
      <g transform="translate(30, 30)">
        <path class="stroke-detail" d="M 10,25 L 14,45 C 14,47 26,47 26,45 L 30,25 Z" />
        <path class="stroke-detail" d="M 8,25 C 8,18 15,15 20,15 C 25,15 32,18 32,25 C 34,25 35,20 30,17 C 28,12 23,10 20,10 C 17,10 12,12 10,17 C 5,20 6,25 8,25 Z" />
        <circle class="stroke-detail" cx="20" cy="7" r="3" />
      </g>

      <!-- Croissant -->
      <g transform="translate(130, 40)">
        <path class="stroke-detail" d="M 5,25 C 10,10 30,10 35,25 C 28,23 23,26 20,30 C 17,26 12,23 5,25 Z" />
        <path class="stroke-detail" d="M 13,17 C 16,21 16,25 16,25" />
        <path class="stroke-detail" d="M 27,17 C 24,21 24,25 24,25" />
      </g>

      <!-- Rebanada de Pastel -->
      <g transform="translate(120, 130)">
        <path class="stroke-detail" d="M 10,30 L 40,30 L 35,15 L 10,30 Z" />
        <path class="stroke-detail" d="M 10,30 L 10,42 L 40,42 L 40,30" />
        <path class="stroke-detail" d="M 10,36 L 40,36" />
        <circle class="stroke-detail" cx="25" cy="18" r="2.5" />
      </g>

      <!-- Rodete / Rollo de Canela -->
      <g transform="translate(30, 130)">
        <ellipse class="stroke-detail" cx="20" cy="20" rx="15" ry="10" />
        <path class="stroke-detail" d="M 12,20 C 12,16 25,15 25,20 C 25,23 16,23 16,20 C 16,18 22,18 22,20" />
      </g>

      <!-- Detalle minimalista: Batidor de varillas -->
      <g transform="translate(85, 80)">
        <path class="stroke-detail" d="M 15,5 C 8,15 8,25 15,30 C 22,25 22,15 15,5 Z" />
        <path class="stroke-detail" d="M 15,5 L 15,30" />
        <path class="stroke-detail" d="M 15,30 L 15,42" />
      </g>

      <!-- Pequeños destellos / chispas dispersas -->
      <circle class="soft-fill" cx="90" cy="30" r="4" />
      <circle class="soft-fill" cx="30" cy="95" r="3" />
      <circle class="soft-fill" cx="170" cy="100" r="3.5" />
      <circle class="soft-fill" cx="95" cy="170" r="4" />
      
      <!-- Estrellas / Destellos de repostería -->
      <path class="stroke-detail" d="M 165,20 L 165,26 M 162,23 L 168,23" />
      <path class="stroke-detail" d="M 10,180 L 10,186 M 7,183 L 13,183" />
    </pattern>
  </defs>

  <!-- Capa de Fondo -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Capa con el Patrón -->
  <rect width="100%" height="100%" fill="url(#bakery-pattern)" />
</svg>
